name: DocuMind CI/CD Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests, Real Tesseract OCR & Alembic Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system OCR and OpenCV libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng libgl1 libglib2.0-0
          tesseract --version

      - name: Install backend and ML test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt -r ml/requirements.txt
          pip install pytest pytest-asyncio httpx aiosqlite pyyaml

      - name: Verify Alembic clean upgrade and downgrade
        env:
          JWT_SECRET_KEY: "ci-test-only-secret-key-not-used-in-production-0001"
          SYNC_DATABASE_URL: "sqlite:///./ci_alembic_verify.db"
          DATABASE_URL: "sqlite+aiosqlite:///./ci_alembic_verify.db"
        run: |
          alembic -c backend/alembic.ini upgrade head
          alembic -c backend/alembic.ini downgrade base
          alembic -c backend/alembic.ini upgrade head
          rm -f ci_alembic_verify.db

      - name: Run full pytest suite (including unmocked Tesseract OCR integration)
        env:
          JWT_SECRET_KEY: "ci-test-only-secret-key-not-used-in-production-0001"
        run: |
          python -m pytest -v tests

  frontend-and-e2e:
    name: Frontend Build, Security Audit & Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.11 for E2E API server
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install E2E backend and Tesseract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng libgl1 libglib2.0-0
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt aiosqlite

      - name: Install frontend dependencies & run production audit/lint/build
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run build

      - name: Install Playwright Chromium & run real browser E2E suite
        working-directory: frontend
        env:
          E2E_PYTHON: "python3"
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload Playwright debug traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            frontend/test-results
            docs/screenshots
          retention-days: 7

  docker-validate:
    name: Docker Compose Config & Image Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate development & production Compose manifests
        env:
          POSTGRES_PASSWORD: "ci-compose-postgres-password"
          REDIS_PASSWORD: "ci-compose-redis-password"
          JWT_SECRET_KEY: "ci-compose-jwt-secret-key-at-least-32-chars"
          CORS_ORIGINS: "https://documind.example.com"
          FLOWER_BASIC_AUTH: "admin:ci-flower-pass"
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

      - name: Build production containers
        run: |
          docker compose build backend worker frontend
